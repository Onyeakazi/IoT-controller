<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controller Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://virtualiotcontrol-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const devicesRef = ref(db, "devices");

    // Update Firebase immediately
    function updateDevice(device, state) {
      set(ref(db, `devices/${device}`), state);
    }

    // Real-time listener for instant updates
    onValue(devicesRef, (snapshot) => {
      const data = snapshot.val() || {};
      ["light", "fan", "socket"].forEach((dev) => {
        const toggle = document.getElementById(dev);
        if (toggle.checked !== data[dev]) {
          toggle.checked = data[dev];
        }
        // Update visual style
        toggle.parentElement.classList.toggle("bg-green-500", data[dev]);
        toggle.parentElement.classList.toggle("bg-gray-300", !data[dev]);
      });
    });

    window.toggleDevice = (device) => {
      const state = document.getElementById(device).checked;
      updateDevice(device, state);
    };
  </script>
  <style>
    /* Custom toggle style */
    .toggle {
      width: 60px;
      height: 34px;
      position: relative;
      display: inline-block;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px; width: 26px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #34d399; /* Tailwind green-400 */
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
  </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-xl rounded-3xl p-8 w-96 text-center">
    <h2 class="text-2xl font-bold mb-6">Switch Controllers</h2>

    <div class="space-y-6">
      <div class="flex justify-between items-center p-3 rounded-lg bg-gray-300 transition duration-300">
        <span class="text-lg font-semibold">💡 Light</span>
        <label class="toggle">
          <input id="light" type="checkbox" onchange="toggleDevice('light')" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="flex justify-between items-center p-3 rounded-lg bg-gray-300 transition duration-300">
        <span class="text-lg font-semibold">🌀 Fan</span>
        <label class="toggle">
          <input id="fan" type="checkbox" onchange="toggleDevice('fan')" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="flex justify-between items-center p-3 rounded-lg bg-gray-300 transition duration-300">
        <span class="text-lg font-semibold">🔌 Socket</span>
        <label class="toggle">
          <input id="socket" type="checkbox" onchange="toggleDevice('socket')" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>
</body>
</html>
